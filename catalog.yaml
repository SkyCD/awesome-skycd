  - name: Feature plugins
    description: Small additions that make the app more pleasant to live in, like a built-in web browser opened from the Tools menu. They do not read files; they add a handy tool or a missing window to the interface.
    items:
      - name: Web Browser
        description: Opens a built-in web browser.
        project_url: https://github.com/SkyCD/SkyCD.Plugin.Feature.WebBrowser
        source_url: https://skycd.github.io/SkyCD.Plugin.Feature.WebBrowser/plugins.json
  - name: Sample plugins
    description: Small reference plugins that show how the plugin API and interface contracts fit together, including an options page, a menu command and a blocking dialog. Read them before writing your own plugin, or copy one as a starting point.
    items:
      - name: Sample Configuration
        description: Shows an embedded options page.
        project_url: https://github.com/SkyCD/SkyCD.Plugin.Sample.Config
        source_url: https://skycd.github.io/SkyCD.Plugin.Sample.Config/plugins.json
      - name: Sample Menu
        description: Shows a Tools menu command.
        project_url: https://github.com/SkyCD/SkyCD.Plugin.Sample.Menu
        source_url: https://skycd.github.io/SkyCD.Plugin.Sample.Menu/plugins.json
      - name: Sample Modal
        description: Shows a blocking export dialog.

# Source of truth for the SkyCD plugin directory.
# README.md and the published plugins.json are generated from this file by
# .github/workflows/render-catalog.yml. Edit this file, not the generated files.
# See CONTRIBUTING.md for the schema and inclusion rules.
categories:
  - name: Metadata plugins
    items:
      - name: 3D Model Metadata and Preview
        description: Extracts structural metadata and renders thumbnails for 3D model files.
        project_url: https://github.com/SkyCD/SkyCD.Plugin.Metadata.Models3D
        source_url: https://skycd.github.io/SkyCD.Plugin.Metadata.Models3D/plugins.json
      - name: AbiWord Document Metadata and Preview
        description: Reads bounded document metadata from AbiWord XML and gzip-compressed AbiWord files without loading external resources or requiring AbiWord, and renders a bounded thumbnail of the leading body text.
        project_url: https://github.com/SkyCD/SkyCD.Plugin.Metadata.AbiWord
        source_url: https://skycd.github.io/SkyCD.Plugin.Metadata.AbiWord/plugins.json
      - name: Apple iWork Document Metadata
        description: Reads format version, producer build, language, identifier and package inventory from modern Apple iWork (Pages, Numbers and Keynote) packages without altering them. No credential is requested, guessed or stored, and a protected package is reported as protected while its plain metadata is still catalogued.
        project_url: https://github.com/SkyCD/SkyCD.Plugin.Metadata.IWork
        source_url: https://skycd.github.io/SkyCD.Plugin.Metadata.IWork/plugins.json
      - name: Archive Contents
        description: Contributes the entries of supported archives as scan work items so metadata providers can inspect them.
        project_url: https://github.com/SkyCD/SkyCD.Plugin.Metadata.Archives
        source_url: https://skycd.github.io/SkyCD.Plugin.Metadata.Archives/plugins.json
      - name: Audio Tags, Cover Art and Audio CDs
        description: Extracts normalized audio tags and technical stream facts from MP3, FLAC, Ogg Vorbis and M4A sources, reads embedded cover art as a bounded preview, identifies audio CDs and their tracks during catalog scanning, and optionally retrieves disc and track details from MusicBrainz and GnuDb with cover art under configurable per-disc and per-track options.
        project_url: https://github.com/SkyCD/SkyCD.Plugin.Metadata.Audio
        source_url: https://skycd.github.io/SkyCD.Plugin.Metadata.Audio/plugins.json
      - name: Disk Images
        description: Contributes the files inside supported disk images as scan work items so metadata providers can inspect them.
        project_url: https://github.com/SkyCD/SkyCD.Plugin.Metadata.DiskImages
        source_url: https://skycd.github.io/SkyCD.Plugin.Metadata.DiskImages/plugins.json
      - name: eBook Metadata and Covers
        description: Reads title, author and publication metadata from epub, ibook, mobi, azw, azw3, prc and fb2 e-books, publishes author tags and preferred names, and extracts a bounded cover image during indexing.
        project_url: https://github.com/SkyCD/SkyCD.Plugin.Metadata.EBook
        source_url: https://skycd.github.io/SkyCD.Plugin.Metadata.EBook/plugins.json
      - name: eComic Metadata and Covers
        description: Reads ComicInfo.xml from cbz, cbr and cb7 comic archives, publishes series and title metadata with optional preferred names and writer tags, and extracts a bounded cover image during indexing.
        project_url: https://github.com/SkyCD/SkyCD.Plugin.Metadata.EComic
        source_url: https://skycd.github.io/SkyCD.Plugin.Metadata.EComic/plugins.json
      - name: Email Metadata
        description: Captures message metadata from EML and MSG files and mailbox metadata from PST stores.
        project_url: https://github.com/SkyCD/SkyCD.Plugin.Metadata.Email
        source_url: https://skycd.github.io/SkyCD.Plugin.Metadata.Email/plugins.json
      - name: Executable File Facts and Icons
        description: Reads PE version information and technical facts from executable files with the in-box PE reader, and extracts the program's own icon as a bounded, index-time PNG preview so the catalog can show it offline. PNG icons are decoded with SkiaSharp; no Windows-only API is used.
        project_url: https://github.com/SkyCD/SkyCD.Plugin.Metadata.Executable
        source_url: https://skycd.github.io/SkyCD.Plugin.Metadata.Executable/plugins.json
      - name: File Metadata
        description: Reads the tags, comment and rating a user or a colleague assigned through Windows file properties, Linux extended attributes or macOS Finder properties, so the catalog keeps the metadata that is not stored in the file bytes.
        project_url: https://github.com/SkyCD/SkyCD.Plugin.Metadata.FileMetadata
        source_url: https://skycd.github.io/SkyCD.Plugin.Metadata.FileMetadata/plugins.json
      - name: Font Metadata and Previews
        description: Reads font name, version and copyright from ttf, ttc, otf and otc files and renders a bounded preview image with the font's own glyphs.
        project_url: https://github.com/SkyCD/SkyCD.Plugin.Metadata.Fonts
        source_url: https://skycd.github.io/SkyCD.Plugin.Metadata.Fonts/plugins.json
      - name: Game Engine Project and Asset Metadata
        description: Reads typed project and asset facts from Godot, Unity, Unreal, Roblox, GameMaker, RPG Maker, Construct 3, Cocos, Defold, CRYENGINE, O3DE, Flax, Stride, Wicked, Ren'Py, s&box, MonoGame/FNA, LÖVE, libGDX atlases, Tiled, LDtk and Aseprite files, with bounded pixel and structure thumbnails. Referenced tilesets, GUID targets and media files are never opened.
        project_url: https://github.com/SkyCD/SkyCD.Plugin.Metadata.GameDev
        source_url: https://skycd.github.io/SkyCD.Plugin.Metadata.GameDev/plugins.json
      - name: Image Preview and Metadata
        description: See image tags, dimensions and previews where supported. TIFF support reads tags, and some document formats depend on an embedded preview.
        project_url: https://github.com/SkyCD/SkyCD.Plugin.Metadata.Image
        source_url: https://skycd.github.io/SkyCD.Plugin.Metadata.Image/plugins.json
      - name: Jupyter Notebook Metadata
        description: Reads notebook format version, kernel language, cell counts and leading cell titles from Jupyter notebooks through the bounded OfficeIMO reader. The source is never executed, stored output payloads are never decoded, and no kernel, widget or remote resource is contacted.
        project_url: https://github.com/SkyCD/SkyCD.Plugin.Metadata.Notebook
        source_url: https://skycd.github.io/SkyCD.Plugin.Metadata.Notebook/plugins.json
      - name: Microsoft Office Document Metadata
        description: Reads title, author, dates and document statistics from Word, Excel, PowerPoint, Visio, OneNote, Access and Project documents without altering them. Password-protected content is never decrypted.
        project_url: https://github.com/SkyCD/SkyCD.Plugin.Metadata.Office
        source_url: https://skycd.github.io/SkyCD.Plugin.Metadata.Office/plugins.json
      - name: Microsoft Works Document Metadata and Preview
        description: Reads title, author, dates and document statistics from Microsoft Works word processor sources, and publishes an embedded preview or a bounded thumbnail of the document's leading text. The source is never modified, decrypted or opened by path.
        project_url: https://github.com/SkyCD/SkyCD.Plugin.Metadata.Works
        source_url: https://skycd.github.io/SkyCD.Plugin.Metadata.Works/plugins.json
      - name: OpenOffice Document Metadata
        description: Reads document metadata from OpenDocument and legacy OpenOffice.org packages, including text fields, statistics and dates, without altering the source. Protected documents are reported as needing a credential and are never decrypted.
        project_url: https://github.com/SkyCD/SkyCD.Plugin.Metadata.OpenOffice
        source_url: https://skycd.github.io/SkyCD.Plugin.Metadata.OpenOffice/plugins.json
      - name: P2P File Hashes
        description: Streams any file once to compute interoperable eD2k and Tiger Tree Hash identifiers plus a conventional SHA-256 digest.
        project_url: https://github.com/SkyCD/SkyCD.Plugin.Metadata.Hash
        source_url: https://skycd.github.io/SkyCD.Plugin.Metadata.Hash/plugins.json
      - name: Sequencer Metadata
        description: Catalogs DAW projects, MIDI files and tracker modules with structure previews.
        project_url: https://github.com/SkyCD/SkyCD.Plugin.Metadata.Sequencer
        source_url: https://skycd.github.io/SkyCD.Plugin.Metadata.Sequencer/plugins.json
      - name: Video Metadata and Poster Frames
        description: Reads container metadata from MP4, Matroska, WebM and AVI sources, and renders one bounded poster frame in-process with the bundled OpenCV decoder, falling back to an explicitly configured external decoder when one is available.
        project_url: https://github.com/SkyCD/SkyCD.Plugin.Metadata.Video
        source_url: https://skycd.github.io/SkyCD.Plugin.Metadata.Video/plugins.json
      - name: Video Project Metadata
        description: "Reads bounded project facts from Adobe Premiere Pro (.prproj), After Effects (.aep, .aepx) and DaVinci Resolve (.drp, .drt) projects: application version, timelines, tracks, clips, frame rate, duration and referenced media counts, without opening the referenced media."
        project_url: https://github.com/SkyCD/SkyCD.Plugin.Metadata.VideoProjects
        source_url: https://skycd.github.io/SkyCD.Plugin.Metadata.VideoProjects/plugins.json
      - name: Volume Serial Number
        description: Captures the read-only filesystem volume serial number of a disk when it is added to a catalog.
        project_url: https://github.com/SkyCD/SkyCD.Plugin.Metadata.Volume
        source_url: https://skycd.github.io/SkyCD.Plugin.Metadata.Volume/plugins.json
      - name: WordPerfect Document Metadata and Preview
        description: Reads the extended document summary from Corel WordPerfect documents, including compound-document storage, and renders a bounded thumbnail of the leading body text, without altering the source. Protected documents are reported as needing a credential and are never decrypted.
        project_url: https://github.com/SkyCD/SkyCD.Plugin.Metadata.WordPerfect
        source_url: https://skycd.github.io/SkyCD.Plugin.Metadata.WordPerfect/plugins.json
      - name: XMP Sidecar Metadata
        description: Reads the keywords, description and rating from standalone XMP sidecar files, so a photo's catalog tags travel with the sidecar even when the image formats are read elsewhere.
        project_url: https://github.com/SkyCD/SkyCD.Plugin.Metadata.Xmp
        source_url: https://skycd.github.io/SkyCD.Plugin.Metadata.Xmp/plugins.json

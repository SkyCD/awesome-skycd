name: Check catalog links (advisory)

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install the pinned YAML parser
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Probe manifest URLs
        run: node scripts/check-catalog-links.mjs catalog.yaml

name: Validate catalog

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: validate-catalog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install the pinned YAML parser
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run tests
        run: node --test
      - name: Validate catalog.yaml
        run: node .github/scripts/validate-catalog.mjs catalog.yaml
      - name: Create render output directory
        run: mkdir -p .build
      - name: Render plugins.json
        uses: cuchi/jinja2-action@v1.3.0
        with:
          template: templates/plugins.json.j2
          data_file: catalog.yaml
          data_format: yaml
          output_file: .build/plugins.json
          strict: true
      - name: Validate rendered plugins.json
        run: node .github/scripts/validate-catalog.mjs .build/plugins.json
      - name: Render index.html
        uses: cuchi/jinja2-action@v1.3.0
        with:
          template: templates/index.html.j2
          data_file: catalog.yaml
          data_format: yaml
          output_file: .build/index.html
          strict: true
